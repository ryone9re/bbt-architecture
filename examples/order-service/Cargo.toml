[workspace]
resolver = "3"
members = ["apps/*", "src/business", "src/entrypoint/*", "src/integration/*", "src/infrastructure/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
moka = { version = "0.12", features = ["future"] }
opentelemetry = "0.32"
opentelemetry_sdk = "0.32"
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["trace", "grpc-tonic"] }
redis = { version = "1.0", default-features = false, features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "chrono", "uuid", "migrate", "macros"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
tower = { version = "0.5", features = ["limit", "load-shed", "util"] }
tower-http = { version = "0.6", features = ["request-id", "timeout"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
business = { path = "src/business" }
infra-postgres = { path = "src/infrastructure/postgres" }
infra-cache = { path = "src/infrastructure/cache" }
infra-telemetry = { path = "src/infrastructure/telemetry" }
infra-runtime = { path = "src/infrastructure/runtime" }
integration-orders = { path = "src/integration/orders" }
integration-maintenance = { path = "src/integration/maintenance" }
integration-reporting = { path = "src/integration/reporting" }
entry-http = { path = "src/entrypoint/http" }
entry-cli = { path = "src/entrypoint/cli" }
app-server = { path = "apps/server" }
app-cleanup = { path = "apps/cleanup" }
app-rebuild-sales = { path = "apps/rebuild-sales" }
app-migrate = { path = "apps/migrate" }
